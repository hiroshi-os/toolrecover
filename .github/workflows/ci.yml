name: checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-training-results
          path: |
            reports/cpu-results.json
            artifacts/*/training.json
  hf-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[hf]'
      - run: python tests/integration_hf.py
      - uses: actions/upload-artifact@v4
        with:
          name: hf-backend-integration
          path: reports/hf-integration.json
